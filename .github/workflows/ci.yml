name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  contract:
    name: Plugin contract
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
      # mise exec runs the shellcheck mise.lock pins, never one the runner image ships.
      - name: Check shell scripts
        run: mise exec -- shellcheck scripts/*.sh test/fixture-php.sh
      - name: Run offline installation test
        run: scripts/test.sh

  # Not yet required checks (docs/repository-settings.md). The autorelease
  # consumer's own pull requests get their checks from scripts/dispatch-pr-checks,
  # which waits for and re-posts only "Plugin contract" and "Protected controls",
  # so requiring these jobs first would leave those unattended merges blocked.
  linux:
    name: Plugin contract on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
      - name: Run offline installation test
        run: scripts/test.sh
