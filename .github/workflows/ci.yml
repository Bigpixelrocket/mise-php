name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  contract:
    name: Plugin contract
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Check shell scripts
        run: shellcheck scripts/*.sh test/fixture-php.sh
      - name: Run offline installation test
        run: scripts/test.sh
