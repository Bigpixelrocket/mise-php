name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  contract:
    name: Plugin contract
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v4
      # mise exec runs the shellcheck mise.lock pins, never one the runner image ships.
      - name: Check shell scripts
        run: mise exec -- shellcheck scripts/*.sh test/fixture-php.sh
      - name: Run offline installation test
        run: scripts/test.sh

  # Required checks like "Plugin contract" once the ruleset lists them; the
  # configure command in docs/repository-settings.md sets all three. The
  # autorelease consumer's own pull requests get their checks from
  # scripts/dispatch-pr-checks, which waits for every check the ruleset
  # requires. Only these jobs run the suite's Linux cases, such as the NixOS
  # refusal, so those cases gate a merge only while these checks are required.
  linux:
    name: Plugin contract on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v4
      - name: Run offline installation test
        run: scripts/test.sh
