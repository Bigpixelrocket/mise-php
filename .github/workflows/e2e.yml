name: Published release test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published php-bin release tag
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install:
    name: Install PHP ${{ inputs.version }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Link plugin
        run: mise plugin link php "$GITHUB_WORKSPACE"
      - name: Install published release
        run: mise install "php@${{ inputs.version }}"
      - name: Smoke test PHP
        run: |
          mise exec "php@${{ inputs.version }}" -- php -v
          mise exec "php@${{ inputs.version }}" -- php -m | grep -Fx Core
          mise exec "php@${{ inputs.version }}" -- php -m | grep -Fx redis
          mise exec "php@${{ inputs.version }}" -- php -m | grep -Fx sqlsrv
