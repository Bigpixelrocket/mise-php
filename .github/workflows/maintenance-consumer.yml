name: php-bin policy consumer

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mise-php-maintenance-consumer
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      trigger: ${{ steps.compare.outputs.trigger }}
      edits_required: ${{ steps.plan.outputs.edits_required }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture accepted public php-bin policy
        run: |
          mkdir -p maintenance-run
          ./scripts/consume-php-policy fetch \
            --output maintenance-run/support-policy.json \
            --commit-output maintenance-run/php-bin-main.json \
            --manifest maintenance-run/policy-capture.json
      - name: Compare only opaque policy and event digests
        id: compare
        run: |
          ./scripts/consume-php-policy compare \
            --policy maintenance-run/support-policy.json \
            --policy-commit maintenance-run/php-bin-main.json \
            --snapshot support-snapshot.json \
            --events maintenance-events \
            --output maintenance-run/decision.json
          echo "trigger=$(jq -r .trigger maintenance-run/decision.json)" >> "$GITHUB_OUTPUT"
      - name: Prepare exact investigation contract
        if: steps.compare.outputs.trigger != 'quiet'
        run: |
          jq -n \
            --arg actionKey "consume:${{ steps.compare.outputs.trigger }}:${{ github.run_id }}" \
            --arg misePhpHead "$(git rev-parse HEAD)" \
            --arg phpBinPolicyCommit "$(jq -r .phpBinPolicyCommit maintenance-run/decision.json)" \
            --arg supportPolicyDigest "$(jq -r .policyDigest maintenance-run/decision.json)" \
            '{
              contractVersion:1,
              phase:"investigation",
              goal:"Determine the exact mise-php work required by the accepted php-bin policy.",
              actionKey:$actionKey,
              preconditions:{misePhpHead:$misePhpHead,phpBinPolicyCommit:$phpBinPolicyCommit,supportPolicyDigest:$supportPolicyDigest},
              allowedAuthority:["read_repository","read_captured_policy"],
              nonGoals:["upstream_php_classification","repository_mutation","irreversible_github_effect"],
              completionCriteria:[
                {id:"phase-goal-correct",requirement:"The goal matches exact inputs.",evidenceRequired:"Exact preconditions."},
                {id:"policy-difference-explained",requirement:"Every required local change is bound to captured policy.",evidenceRequired:"Policy digest and JSON locator."},
                {id:"authority-explicit",requirement:"Paths and checks are explicit.",evidenceRequired:"Allowed paths and required checks."},
                {id:"no-unresolved-work",requirement:"No contradiction or stop condition remains.",evidenceRequired:"Empty unresolved list."}
              ],
              stopConditions:["missing_or_contradictory_policy","changed_precondition","required_protected_change"]
            }' > maintenance-run/event-contract.json
          shared="sha256:$(shasum -a 256 .github/codex/maintenance/shared.md | awk '{print $1}')"
          phase="sha256:$(shasum -a 256 .github/codex/maintenance/investigation.md | awk '{print $1}')"
          event="sha256:$(shasum -a 256 maintenance-run/event-contract.json | awk '{print $1}')"
          {
            cat .github/codex/maintenance/shared.md
            cat .github/codex/maintenance/investigation.md
            echo
            echo '# Event contract'
            jq . maintenance-run/event-contract.json
            echo
            echo '# Required instruction digests'
            jq -n --arg shared "$shared" --arg phaseTemplate "$phase" --arg eventContract "$event" \
              '{shared:$shared,phaseTemplate:$phaseTemplate,eventContract:$eventContract}'
          } > maintenance-run/investigation-prompt.md
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp .codex/investigation.config.toml "$RUNNER_TEMP/codex-home/"
      - name: Run repository-scoped offline Codex investigation
        if: steps.compare.outputs.trigger != 'quiet'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: maintenance-run/investigation-prompt.md
          output-file: maintenance-run/maintenance-plan.json
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-users: loadinglucian
          allow-bots: github-actions[bot]
          codex-args: '["--ephemeral","--profile","investigation","--output-schema","schemas/maintenance-plan.schema.json"]'
      - name: Admit plan against exact policy and checkout
        if: steps.compare.outputs.trigger != 'quiet'
        run: |
          ./scripts/admit-maintenance-plan \
            --plan maintenance-run/maintenance-plan.json \
            --contract maintenance-run/event-contract.json \
            --shared .github/codex/maintenance/shared.md \
            --phase .github/codex/maintenance/investigation.md \
            --event-contract maintenance-run/event-contract.json \
            --policy-digest "$(jq -r .policyDigest maintenance-run/decision.json)" \
            --mise-head "$(git rev-parse HEAD)" \
            --output maintenance-run/admission.json
      - name: Expose plan
        id: plan
        if: steps.compare.outputs.trigger != 'quiet'
        run: |
          echo "edits_required=$(jq -r .editsRequired maintenance-run/maintenance-plan.json)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mise-maintenance-investigation-${{ github.run_id }}
          path: maintenance-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  implement:
    needs: investigate
    if: needs.investigate.outputs.edits_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.investigate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-maintenance-investigation-${{ github.run_id }}
          path: maintenance-run
      - name: Prepare implementation contract and prompt
        run: |
          jq \
            '.phase="implementation"
             | .goal="Implement the admitted mise-php policy synchronization at the exact base."
             | .allowedAuthority=["workspace_write_admitted_paths","local_advisory_checks"]
             | .nonGoals=["protected_control_change","irreversible_github_effect"]
             | .completionCriteria=[
                {id:"phase-goal-correct",requirement:"Goal and preconditions remain exact.",evidenceRequired:"Plan digest and base SHA."},
                {id:"admitted-diff-complete",requirement:"Diff is complete and admitted.",evidenceRequired:"Final diff and path comparison."},
                {id:"advisory-checks-recorded",requirement:"All checks ran.",evidenceRequired:"Commands and results."},
                {id:"no-unresolved-work",requirement:"No in-scope work remains.",evidenceRequired:"Empty unresolved list."}
             ]' \
            maintenance-run/event-contract.json > maintenance-run/implementation-contract.json
          shared="sha256:$(shasum -a 256 .github/codex/maintenance/shared.md | awk '{print $1}')"
          phase="sha256:$(shasum -a 256 .github/codex/maintenance/implementation.md | awk '{print $1}')"
          event="sha256:$(shasum -a 256 maintenance-run/implementation-contract.json | awk '{print $1}')"
          {
            cat .github/codex/maintenance/shared.md
            cat .github/codex/maintenance/implementation.md
            echo
            jq . maintenance-run/implementation-contract.json
            jq -n --arg shared "$shared" --arg phaseTemplate "$phase" --arg eventContract "$event" \
              '{shared:$shared,phaseTemplate:$phaseTemplate,eventContract:$eventContract}'
            echo
            cat maintenance-run/maintenance-plan.json
          } > maintenance-run/implementation-prompt.md
          jq --arg shared "$shared" --arg phaseTemplate "$phase" --arg eventContract "$event" \
            '.agentContract.instructionDigests={shared:$shared,phaseTemplate:$phaseTemplate,eventContract:$eventContract}' \
            maintenance-run/maintenance-plan.json > maintenance-run/implementation-plan.json
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp .codex/implementation.config.toml "$RUNNER_TEMP/codex-home/"
      - name: Run offline Codex implementation
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: maintenance-run/implementation-prompt.md
          output-file: maintenance-run/implementation-result.json
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-users: loadinglucian
          allow-bots: github-actions[bot]
          codex-args: '["--ephemeral","--profile","implementation","--output-schema","schemas/agent-completion-assessment.schema.json"]'
      - name: Seal admitted diff
        run: |
          ./scripts/seal-maintenance-patch \
            --repo . \
            --base "${{ needs.investigate.outputs.base_sha }}" \
            --plan maintenance-run/implementation-plan.json \
            --result maintenance-run/implementation-result.json \
            --contract maintenance-run/implementation-contract.json \
            --output maintenance-run/sealed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mise-sealed-maintenance-patch-${{ github.run_id }}
          path: maintenance-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  validate:
    needs: [investigate, implement]
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.investigate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-sealed-maintenance-patch-${{ github.run_id }}
          path: maintenance-run
      - name: Apply exact sealed patch in clean checkout
        run: |
          expected="$(jq -r .patchDigest maintenance-run/sealed/patch-manifest.json)"
          actual="sha256:$(shasum -a 256 maintenance-run/sealed/sealed.patch | awk '{print $1}')"
          test "$actual" = "$expected"
          git apply --index maintenance-run/sealed/sealed.patch
      - name: Run authoritative plugin checks without OpenAI credential
        run: |
          test -z "${OPENAI_API_KEY:-}"
          ./scripts/test.sh
      - name: Create reproducible validated commit bundle
        run: |
          export GIT_AUTHOR_NAME=maintenance-validator
          export GIT_AUTHOR_EMAIL=maintenance@invalid
          export GIT_COMMITTER_NAME=maintenance-validator
          export GIT_COMMITTER_EMAIL=maintenance@invalid
          export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z
          export GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
          git commit -m "chore: apply admitted maintenance patch"
          jq -n --arg headSha "$(git rev-parse HEAD)" --arg tree "$(git rev-parse HEAD^{tree})" \
            '{headSha:$headSha,tree:$tree,checks:{"Plugin contract":"success"}}' > maintenance-run/validation.json
          git bundle create maintenance-run/validated.bundle HEAD "^${{ needs.investigate.outputs.base_sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mise-validated-maintenance-patch-${{ github.run_id }}
          path: maintenance-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  merge-and-record-readiness:
    needs: [investigate, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.investigate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-validated-maintenance-patch-${{ github.run_id }}
          path: maintenance-run
      - name: Restore and push exact validated commit
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validated="$(jq -r .headSha maintenance-run/validation.json)"
          git fetch maintenance-run/validated.bundle "$validated"
          git checkout --detach "$validated"
          test "$(git rev-parse HEAD)" = "$validated"
          action_key="$(jq -r .actionKey maintenance-run/implementation-plan.json)"
          branch="maintenance/$(printf '%s' "$action_key" | tr ':/' '--')"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            url="$(gh pr create --base main --head "$branch" --title "chore: $action_key" \
              --body "Deterministically sealed mise-php maintenance patch.\n\nValidated commit: \`$validated\`.")"
            number="${url##*/}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "action_key=$action_key" >> "$GITHUB_OUTPUT"
      - name: Enforce checks and exact validated SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checks "${{ steps.patch.outputs.number }}" --watch --fail-fast --interval 10
          expected="$(jq -r .headSha maintenance-run/validation.json)"
          actual="$(gh pr view "${{ steps.patch.outputs.number }}" --json headRefOid --jq .headRefOid)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          while IFS= read -r encoded; do
            path="$(printf '%s' "$encoded" | base64 --decode | jq -r .path)"
            digest="$(printf '%s' "$encoded" | base64 --decode | jq -r .digest)"
            test "sha256:$(shasum -a 256 "$path" | awk '{print $1}')" = "$digest"
          done < <(jq -r '.files[] | @base64' maintenance-run/sealed/patch-manifest.json)
      - name: Merge exact admitted patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.patch.outputs.number }}" --squash --delete-branch
      - name: Create readiness record at the merged implementation commit
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged="$(gh pr view "${{ steps.patch.outputs.number }}" --json mergeCommit --jq .mergeCommit.oid)"
          git fetch origin main
          git checkout -B maintenance/readiness-${{ github.run_id }} origin/main
          mkdir -p readiness
          filename="$(printf '%s' "${{ steps.patch.outputs.action_key }}" | tr ':/' '--').json"
          mapfile -t digests < <(jq -r '.captures[].digest' maintenance-run/policy-capture.json)
          args=()
          for digest in "${digests[@]}"; do args+=(--evidence-digest "$digest"); done
          ./scripts/consume-php-policy readiness \
            --action-key "${{ steps.patch.outputs.action_key }}" \
            --php-bin-commit "$(jq -r .preconditions.phpBinPolicyCommit maintenance-run/implementation-plan.json)" \
            --policy-digest "$(jq -r .preconditions.supportPolicyDigest maintenance-run/implementation-plan.json)" \
            --mise-commit "$merged" \
            "${args[@]}" \
            --output "readiness/$filename"
          git add "readiness/$filename"
          git -c user.name=maintenance-readiness -c user.email=maintenance@invalid \
            commit -m "chore: record ${{ steps.patch.outputs.action_key }} readiness"
          gh auth setup-git
          git push origin HEAD
          url="$(gh pr create --base main --head "maintenance/readiness-${{ github.run_id }}" \
            --title "chore: record ${{ steps.patch.outputs.action_key }} readiness" \
            --body "Deterministic readiness record for the exact merged implementation commit.")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
      - name: Validate and merge readiness record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checks "${{ steps.readiness.outputs.number }}" --watch --fail-fast --interval 10
          gh pr merge "${{ steps.readiness.outputs.number }}" --squash --delete-branch
