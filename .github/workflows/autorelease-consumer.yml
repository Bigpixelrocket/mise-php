name: php-bin policy consumer

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mise-php-autorelease-consumer
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      trigger: ${{ steps.compare.outputs.trigger }}
      edits_required: ${{ steps.plan.outputs.edits_required }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Bigpixelrocket/php-bin
          path: php-operator-control
          sparse-checkout: |
            .github/autorelease-operator.json
          persist-credentials: false
      - name: Bind investigation to the live operator control
        id: operator
        run: |
          operator="php-operator-control/.github/autorelease-operator.json"
          state="$(jq -r .unattendedMutation "$operator")"
          test "$state" = "paused" || test "$state" = "enabled"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C php-operator-control rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Gate the run on shared-file parity with php-bin
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_BIN_COMMIT: ${{ steps.operator.outputs.commit }}
        run: |
          mapfile -t shared < <(jq -r '.paths[]' autorelease/shared-files.json)
          # mapfile reports success even when the substitution failed, so an
          # absent, unparseable, or empty manifest would disable the gate.
          if [[ "${#shared[@]}" -eq 0 ]]; then
            echo "Shared-file manifest is missing, unparseable, or empty: autorelease/shared-files.json" >&2
            exit 1
          fi
          for path in "${shared[@]}"; do
            gh api "repos/Bigpixelrocket/php-bin/contents/$path?ref=$PHP_BIN_COMMIT" \
              > "$RUNNER_TEMP/shared-file.json"
            # An oversized or symlinked entry comes back unencoded, which would
            # otherwise decode to nothing and be reported as drift.
            test "$(jq -r .encoding "$RUNNER_TEMP/shared-file.json")" = "base64"
            jq -r .content "$RUNNER_TEMP/shared-file.json" | base64 --decode > "$RUNNER_TEMP/shared-file"
            if ! cmp -s "$RUNNER_TEMP/shared-file" "$path"; then
              echo "Shared file drifted from php-bin at $PHP_BIN_COMMIT: $path" >&2
              exit 1
            fi
          done
      - name: Capture accepted public php-bin policy
        run: |
          mkdir -p autorelease-run
          ./scripts/consume-php-policy fetch \
            --output autorelease-run/support-policy.json \
            --invariants-output autorelease-run/policy-invariants.json \
            --commit-output autorelease-run/php-bin-main.json \
            --manifest autorelease-run/policy-capture.json
      - name: Compare only opaque policy and event digests
        id: compare
        run: |
          ./scripts/consume-php-policy compare \
            --policy autorelease-run/support-policy.json \
            --invariants autorelease-run/policy-invariants.json \
            --policy-commit autorelease-run/php-bin-main.json \
            --snapshot support-snapshot.json \
            --events autorelease-events \
            --output autorelease-run/decision.json
          echo "trigger=$(jq -r .trigger autorelease-run/decision.json)" >> "$GITHUB_OUTPUT"
      - name: Prepare exact investigation contract
        if: steps.compare.outputs.trigger != 'quiet' && steps.operator.outputs.state == 'enabled'
        run: |
          jq -n \
            --arg actionKey "$(jq -r .actionKey autorelease-run/decision.json)" \
            --arg misePhpHead "$(git rev-parse HEAD)" \
            --arg phpBinPolicyCommit "$(jq -r .phpBinPolicyCommit autorelease-run/decision.json)" \
            --arg supportPolicyDigest "$(jq -r .policyDigest autorelease-run/decision.json)" \
            --arg policyInvariantsDigest "$(jq -r .policyInvariantsDigest autorelease-run/decision.json)" \
            --arg phpBinOperatorCommit "${{ steps.operator.outputs.commit }}" \
            --arg operatorState "${{ steps.operator.outputs.state }}" \
            --argjson completionCriteria "$(./scripts/prepare-agent-task --phase investigation)" \
            '{
              contractVersion:1,
              phase:"investigation",
              goal:"Determine the exact mise-php work required by the accepted php-bin policy.",
              actionKey:$actionKey,
              preconditions:{misePhpHead:$misePhpHead,phpBinPolicyCommit:$phpBinPolicyCommit,supportPolicyDigest:$supportPolicyDigest,policyInvariantsDigest:$policyInvariantsDigest,phpBinOperatorCommit:$phpBinOperatorCommit,operatorState:$operatorState},
              allowedAuthority:["read_repository","read_captured_policy"],
              nonGoals:["upstream_php_classification","repository_mutation","required_check_execution","irreversible_github_effect"],
              completionCriteria:$completionCriteria,
              stopConditions:["missing_or_contradictory_policy","changed_precondition","required_protected_change"]
            }' > autorelease-run/event-contract.json
          shared="sha256:$(shasum -a 256 .github/codex/autorelease/shared.md | awk '{print $1}')"
          phase="sha256:$(shasum -a 256 .github/codex/autorelease/investigation.md | awk '{print $1}')"
          event="sha256:$(shasum -a 256 autorelease-run/event-contract.json | awk '{print $1}')"
          {
            cat .github/codex/autorelease/shared.md
            cat .github/codex/autorelease/investigation.md
            echo
            echo '# Event contract'
            jq . autorelease-run/event-contract.json
            echo
            echo '# Required instruction digests'
            jq -n --arg shared "$shared" --arg phaseTemplate "$phase" --arg eventContract "$event" \
              '{shared:$shared,phaseTemplate:$phaseTemplate,eventContract:$eventContract}'
          } > autorelease-run/investigation-prompt.md
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp .codex/investigation.config.toml "$RUNNER_TEMP/codex-home/config.toml"
      - name: Run repository-scoped offline Codex investigation
        if: steps.compare.outputs.trigger != 'quiet' && steps.operator.outputs.state == 'enabled'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.145.0
          prompt-file: autorelease-run/investigation-prompt.md
          output-file: autorelease-run/autorelease-plan.json
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-users: loadinglucian
          allow-bots: false
          allow-bot-users: github-actions[bot]
          codex-args: '["--strict-config","--ephemeral","--output-schema","schemas/autorelease-plan.schema.json"]'
      - name: Admit plan against exact policy and checkout
        if: steps.compare.outputs.trigger != 'quiet' && steps.operator.outputs.state == 'enabled'
        run: |
          ./scripts/admit-autorelease-plan \
            --plan autorelease-run/autorelease-plan.json \
            --contract autorelease-run/event-contract.json \
            --shared .github/codex/autorelease/shared.md \
            --phase .github/codex/autorelease/investigation.md \
            --event-contract autorelease-run/event-contract.json \
            --capture-manifest autorelease-run/policy-capture.json \
            --policy-digest "$(jq -r .policyDigest autorelease-run/decision.json)" \
            --invariants-digest "$(jq -r .policyInvariantsDigest autorelease-run/decision.json)" \
            --mise-head "$(git rev-parse HEAD)" \
            --output autorelease-run/admission.json
      - name: Expose plan
        id: plan
        if: steps.compare.outputs.trigger != 'quiet' && steps.operator.outputs.state == 'enabled'
        run: |
          echo "edits_required=$(jq -r .editsRequired autorelease-run/autorelease-plan.json)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mise-autorelease-investigation-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  implement:
    needs: investigate
    if: needs.investigate.outputs.edits_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.investigate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-autorelease-investigation-${{ github.run_id }}
          path: autorelease-run
      - name: Prepare implementation contract and prompt
        run: |
          jq --argjson completionCriteria "$(./scripts/prepare-agent-task --phase implementation)" \
            '.phase="implementation"
             | .goal="Implement the admitted mise-php policy synchronization at the exact base."
             | .allowedAuthority=["workspace_write_admitted_paths","local_advisory_checks"]
             | .nonGoals=["protected_control_change","irreversible_github_effect"]
             | .completionCriteria=$completionCriteria' \
            autorelease-run/event-contract.json > autorelease-run/implementation-contract.json
          shared="sha256:$(shasum -a 256 .github/codex/autorelease/shared.md | awk '{print $1}')"
          phase="sha256:$(shasum -a 256 .github/codex/autorelease/implementation.md | awk '{print $1}')"
          event="sha256:$(shasum -a 256 autorelease-run/implementation-contract.json | awk '{print $1}')"
          {
            cat .github/codex/autorelease/shared.md
            cat .github/codex/autorelease/implementation.md
            echo
            jq . autorelease-run/implementation-contract.json
            jq -n --arg shared "$shared" --arg phaseTemplate "$phase" --arg eventContract "$event" \
              '{shared:$shared,phaseTemplate:$phaseTemplate,eventContract:$eventContract}'
            echo
            cat autorelease-run/autorelease-plan.json
          } > autorelease-run/implementation-prompt.md
          jq --arg shared "$shared" --arg phaseTemplate "$phase" --arg eventContract "$event" \
            '.agentContract.instructionDigests={shared:$shared,phaseTemplate:$phaseTemplate,eventContract:$eventContract}' \
            autorelease-run/autorelease-plan.json > autorelease-run/implementation-plan.json
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp .codex/implementation.config.toml "$RUNNER_TEMP/codex-home/config.toml"
      - name: Run offline Codex implementation
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.145.0
          prompt-file: autorelease-run/implementation-prompt.md
          output-file: autorelease-run/implementation-result.json
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-users: loadinglucian
          allow-bots: false
          allow-bot-users: github-actions[bot]
          codex-args: '["--strict-config","--ephemeral","--output-schema","schemas/agent-completion-assessment.schema.json"]'
      - name: Seal admitted diff
        env:
          BASE_SHA: ${{ needs.investigate.outputs.base_sha }}
        run: |
          ./scripts/seal-autorelease-patch \
            --repo . \
            --base "$BASE_SHA" \
            --plan autorelease-run/implementation-plan.json \
            --result autorelease-run/implementation-result.json \
            --contract autorelease-run/implementation-contract.json \
            --policy autorelease-run/support-policy.json \
            --output autorelease-run/sealed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mise-sealed-autorelease-patch-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  validate:
    needs: [investigate, implement]
    outputs:
      passed: ${{ steps.checks.outputs.passed }}
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.investigate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-sealed-autorelease-patch-${{ github.run_id }}
          path: autorelease-run
      - name: Apply exact sealed patch in clean checkout
        run: |
          expected="$(jq -r .patchDigest autorelease-run/sealed/patch-manifest.json)"
          actual="sha256:$(shasum -a 256 autorelease-run/sealed/sealed.patch | awk '{print $1}')"
          test "$actual" = "$expected"
          git apply --index autorelease-run/sealed/sealed.patch
      - name: Run authoritative plugin checks without OpenAI credential
        id: checks
        run: |
          test -z "${OPENAI_API_KEY:-}"
          set +e
          ./scripts/test.sh 2>&1 | tee autorelease-run/authoritative-checks.log
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "$status" == "0" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create reproducible validated commit bundle
        if: steps.checks.outputs.passed == 'true'
        env:
          BASE_SHA: ${{ needs.investigate.outputs.base_sha }}
        run: |
          export GIT_AUTHOR_NAME=autorelease-validator
          export GIT_AUTHOR_EMAIL=autorelease@invalid
          export GIT_COMMITTER_NAME=autorelease-validator
          export GIT_COMMITTER_EMAIL=autorelease@invalid
          export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z
          export GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
          git commit -m "chore: apply admitted autorelease patch"
          jq -n --arg headSha "$(git rev-parse HEAD)" --arg tree "$(git rev-parse HEAD^{tree})" \
            '{headSha:$headSha,tree:$tree,checks:{"Plugin contract":"success"}}' > autorelease-run/validation.json
          git bundle create autorelease-run/validated.bundle HEAD "^$BASE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.checks.outputs.passed == 'true'
        with:
          name: mise-validated-autorelease-patch-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.checks.outputs.passed != 'true'
        with:
          name: mise-failed-autorelease-validation-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  repair:
    needs: [investigate, validate]
    if: needs.validate.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.investigate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-failed-autorelease-validation-${{ github.run_id }}
          path: autorelease-run
      - name: Restore failed patch and prepare bounded repair
        run: |
          git apply --index autorelease-run/sealed/sealed.patch
          fingerprint="sha256:$(shasum -a 256 autorelease-run/authoritative-checks.log | awk '{print $1}')"
          jq --arg goal "Repair the retained authoritative failure $fingerprint without expanding the admitted diff." \
            --argjson completionCriteria "$(./scripts/prepare-agent-task --phase repair)" \
            '.phase="repair"
             | .goal=$goal
             | .allowedAuthority=["workspace_write_admitted_paths","local_advisory_checks"]
             | .nonGoals=["protected_control_change","irreversible_github_effect"]
             | .stopConditions=["changed_precondition","repeated_or_unrelated_failure","required_protected_change"]
             | .completionCriteria=$completionCriteria' \
            autorelease-run/implementation-contract.json > autorelease-run/repair-contract.json
          shared="sha256:$(shasum -a 256 .github/codex/autorelease/shared.md | awk '{print $1}')"
          phase="sha256:$(shasum -a 256 .github/codex/autorelease/repair.md | awk '{print $1}')"
          event="sha256:$(shasum -a 256 autorelease-run/repair-contract.json | awk '{print $1}')"
          jq --arg shared "$shared" --arg phaseTemplate "$phase" --arg eventContract "$event" \
            '.agentContract.instructionDigests={shared:$shared,phaseTemplate:$phaseTemplate,eventContract:$eventContract}' \
            autorelease-run/implementation-plan.json > autorelease-run/repair-plan.json
          {
            cat .github/codex/autorelease/shared.md
            cat .github/codex/autorelease/repair.md
            jq . autorelease-run/repair-contract.json
            printf '\n# Retained authoritative failure log\n```text\n'
            cat autorelease-run/authoritative-checks.log
            printf '\n```\n# Exact admitted plan\n```json\n'
            jq . autorelease-run/repair-plan.json
            printf '\n```\n'
          } > autorelease-run/repair-prompt.md
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp .codex/repair.config.toml "$RUNNER_TEMP/codex-home/config.toml"
      - name: Run one offline Codex repair
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.145.0
          prompt-file: autorelease-run/repair-prompt.md
          output-file: autorelease-run/repair-result.json
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-users: loadinglucian
          allow-bots: false
          allow-bot-users: github-actions[bot]
          codex-args: '["--strict-config","--ephemeral","--output-schema","schemas/agent-completion-assessment.schema.json"]'
      - name: Seal combined repaired diff
        env:
          BASE_SHA: ${{ needs.investigate.outputs.base_sha }}
        run: |
          mv autorelease-run/repair-plan.json autorelease-run/implementation-plan.json
          ./scripts/seal-autorelease-patch \
            --repo . \
            --base "$BASE_SHA" \
            --plan autorelease-run/implementation-plan.json \
            --result autorelease-run/repair-result.json \
            --contract autorelease-run/repair-contract.json \
            --policy autorelease-run/support-policy.json \
            --output autorelease-run/sealed-repair
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mise-repaired-autorelease-patch-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  validate-repair:
    needs: [investigate, repair]
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.investigate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-repaired-autorelease-patch-${{ github.run_id }}
          path: autorelease-run
      - name: Apply and validate exact repaired bytes
        run: |
          expected="$(jq -r .patchDigest autorelease-run/sealed-repair/patch-manifest.json)"
          actual="sha256:$(shasum -a 256 autorelease-run/sealed-repair/sealed.patch | awk '{print $1}')"
          test "$actual" = "$expected"
          git apply --index autorelease-run/sealed-repair/sealed.patch
          test -z "${OPENAI_API_KEY:-}"
          ./scripts/test.sh
          cp autorelease-run/sealed-repair/sealed.patch autorelease-run/sealed/sealed.patch
          cp autorelease-run/sealed-repair/patch-manifest.json autorelease-run/sealed/patch-manifest.json
      - name: Create repaired validated commit bundle
        env:
          BASE_SHA: ${{ needs.investigate.outputs.base_sha }}
        run: |
          export GIT_AUTHOR_NAME=autorelease-validator
          export GIT_AUTHOR_EMAIL=autorelease@invalid
          export GIT_COMMITTER_NAME=autorelease-validator
          export GIT_COMMITTER_EMAIL=autorelease@invalid
          export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z
          export GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
          git commit -m "chore: apply admitted autorelease repair"
          jq -n --arg headSha "$(git rev-parse HEAD)" --arg tree "$(git rev-parse HEAD^{tree})" \
            '{headSha:$headSha,tree:$tree,checks:{"Plugin contract":"success"}}' > autorelease-run/validation.json
          git bundle create autorelease-run/validated.bundle HEAD "^$BASE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mise-validated-autorelease-patch-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  merge-and-record-readiness:
    needs: [investigate, validate, validate-repair]
    if: always() && (needs.validate.outputs.passed == 'true' || needs['validate-repair'].result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.investigate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-validated-autorelease-patch-${{ github.run_id }}
          path: autorelease-run
      - name: Restore and push exact validated commit
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validated="$(jq -r .headSha autorelease-run/validation.json)"
          git fetch autorelease-run/validated.bundle "$validated"
          git checkout --detach "$validated"
          test "$(git rev-parse HEAD)" = "$validated"
          action_key="$(jq -r .actionKey autorelease-run/implementation-plan.json)"
          # The plan is model-authored. Admission already rejects a malformed
          # action key, but this value reaches $GITHUB_OUTPUT and later shell
          # steps, so its alphabet is re-asserted at the boundary.
          [[ "$action_key" =~ ^[A-Za-z0-9._:-]+$ ]]
          branch="autorelease/$(./scripts/consume-php-policy action-filename "$action_key" --suffix '')"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            url="$(gh pr create --base main --head "$branch" --title "chore: $action_key" \
              --body "Deterministically sealed mise-php autorelease patch.\n\nValidated commit: \`$validated\`.")"
            number="${url##*/}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "action_key=$action_key" >> "$GITHUB_OUTPUT"
      - name: Enforce checks and exact validated SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.patch.outputs.number }}
        run: |
          ./scripts/dispatch-pr-checks \
            --pr "$PR_NUMBER" \
            --check "Plugin contract" \
            --output autorelease-run/pr-checks.json
          ./scripts/assert-admission-checks --check-name "Plugin contract" --checks autorelease-run/pr-checks.json
          expected="$(jq -r .headSha autorelease-run/validation.json)"
          actual="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          git fetch origin main
          ./scripts/consume-php-policy fetch \
            --output autorelease-run/current-support-policy.json \
            --invariants-output autorelease-run/current-policy-invariants.json \
            --commit-output autorelease-run/current-php-bin-main.json \
            --manifest autorelease-run/current-policy-capture.json
          admitted_mise="$(jq -r .preconditions.misePhpHead autorelease-run/implementation-plan.json)"
          admitted_php="$(jq -r .preconditions.phpBinPolicyCommit autorelease-run/implementation-plan.json)"
          admitted_policy="$(jq -r .preconditions.supportPolicyDigest autorelease-run/implementation-plan.json)"
          admitted_invariants="$(jq -r .preconditions.policyInvariantsDigest autorelease-run/implementation-plan.json)"
          admitted_operator_commit="$(jq -r .preconditions.phpBinOperatorCommit autorelease-run/implementation-plan.json)"
          admitted_operator_state="$(jq -r .preconditions.operatorState autorelease-run/implementation-plan.json)"
          current_operator_commit="$(gh api repos/Bigpixelrocket/php-bin/commits/main --jq .sha)"
          gh api "repos/Bigpixelrocket/php-bin/contents/.github/autorelease-operator.json?ref=$current_operator_commit" \
            --jq .content | base64 --decode > autorelease-run/current-operator.json
          jq -n \
            --arg misePhpHead "$admitted_mise" \
            --arg phpBinPolicyCommit "$admitted_php" \
            --arg supportPolicyDigest "$admitted_policy" \
            --arg policyInvariantsDigest "$admitted_invariants" \
            --arg phpBinOperatorCommit "$admitted_operator_commit" \
            --arg operatorState "$admitted_operator_state" \
            '{misePhpHead:$misePhpHead,phpBinPolicyCommit:$phpBinPolicyCommit,supportPolicyDigest:$supportPolicyDigest,policyInvariantsDigest:$policyInvariantsDigest,phpBinOperatorCommit:$phpBinOperatorCommit,operatorState:$operatorState}' \
            > autorelease-run/preconditions.json
          jq -n \
            --arg misePhpHead "$(git rev-parse origin/main)" \
            --arg phpBinPolicyCommit "$(jq -r .sha autorelease-run/current-php-bin-main.json)" \
            --arg supportPolicyDigest "sha256:$(shasum -a 256 autorelease-run/current-support-policy.json | awk '{print $1}')" \
            --arg policyInvariantsDigest "sha256:$(shasum -a 256 autorelease-run/current-policy-invariants.json | awk '{print $1}')" \
            --arg phpBinOperatorCommit "$current_operator_commit" \
            --arg operatorState "$(jq -r .unattendedMutation autorelease-run/current-operator.json)" \
            '{misePhpHead:$misePhpHead,phpBinPolicyCommit:$phpBinPolicyCommit,supportPolicyDigest:$supportPolicyDigest,policyInvariantsDigest:$policyInvariantsDigest,phpBinOperatorCommit:$phpBinOperatorCommit,operatorState:$operatorState}' \
            > autorelease-run/current.json
          jq -n '{"Plugin contract":"success"}' > autorelease-run/checks.json
          ./scripts/verify-merge-admission \
            --repo . \
            --head "$expected" \
            --manifest autorelease-run/sealed/patch-manifest.json \
            --checks autorelease-run/checks.json \
            --preconditions autorelease-run/preconditions.json \
            --current autorelease-run/current.json
      - name: Merge exact admitted patch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.patch.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
      - name: Create readiness record at the merged implementation commit
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_KEY: ${{ steps.patch.outputs.action_key }}
          PR_NUMBER: ${{ steps.patch.outputs.number }}
        run: |
          merged="$(gh pr view "$PR_NUMBER" --json mergeCommit --jq .mergeCommit.oid)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$merged"
          test "$(git rev-parse "$merged^{tree}")" = "$(jq -r .tree autorelease-run/validation.json)"
          git checkout -B autorelease/readiness-${{ github.run_id }} origin/main
          base="$(git rev-parse HEAD)"
          mkdir -p readiness
          filename="$(./scripts/consume-php-policy action-filename "$ACTION_KEY")"
          mapfile -t digests < <(jq -r '.captures[].digest' autorelease-run/policy-capture.json)
          args=()
          for digest in "${digests[@]}"; do args+=(--evidence-digest "$digest"); done
          ./scripts/consume-php-policy readiness \
            --action-key "$ACTION_KEY" \
            --php-bin-commit "$(jq -r .preconditions.phpBinPolicyCommit autorelease-run/implementation-plan.json)" \
            --policy-digest "$(jq -r .preconditions.supportPolicyDigest autorelease-run/implementation-plan.json)" \
            --policy-invariants-digest "$(jq -r .preconditions.policyInvariantsDigest autorelease-run/implementation-plan.json)" \
            --mise-commit "$merged" \
            "${args[@]}" \
            --output "readiness/$filename"
          git add "readiness/$filename"
          git -c user.name=autorelease-readiness -c user.email=autorelease@invalid \
            commit -m "chore: record $ACTION_KEY readiness"
          gh auth setup-git
          git push origin HEAD
          url="$(gh pr create --base main --head "autorelease/readiness-${{ github.run_id }}" \
            --title "chore: record $ACTION_KEY readiness" \
            --body "Deterministic readiness record for the exact merged implementation commit.")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "record=readiness/$filename" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:$(shasum -a 256 "readiness/$filename" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Validate and merge readiness record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/dispatch-pr-checks \
            --pr "${{ steps.readiness.outputs.number }}" \
            --check "Plugin contract" \
            --output autorelease-run/readiness-checks.json
          ./scripts/assert-admission-checks --check-name "Plugin contract" --checks autorelease-run/readiness-checks.json
          actual="$(gh pr view "${{ steps.readiness.outputs.number }}" --json headRefOid --jq .headRefOid)"
          test "$actual" = "${{ steps.readiness.outputs.head_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.readiness.outputs.base_sha }}"
          test "$(git rev-list --parents -n 1 "$actual")" = "$actual ${{ steps.readiness.outputs.base_sha }}"
          test "$(git diff --name-only "${{ steps.readiness.outputs.base_sha }}" "$actual")" = "${{ steps.readiness.outputs.record }}"
          test "sha256:$(git show "$actual:${{ steps.readiness.outputs.record }}" | shasum -a 256 | awk '{print $1}')" = "${{ steps.readiness.outputs.digest }}"
          gh pr merge "${{ steps.readiness.outputs.number }}" --squash --delete-branch
